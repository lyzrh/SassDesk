<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<!-- Sass animated rig (部件化肢体动画)：状态 working -->
<style>
  * { transform-box: fill-box; }
  
    .tail-1, .tail-2, .tail-3 { animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .glow { animation: glowPulse 2s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .star { animation: starTwinkle 1.4s ease-in-out infinite; }
    @keyframes starTwinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
  
      /* 双爪交替打字 */
      .arm-l { animation: typeL .38s ease-in-out infinite alternate; }
      .arm-r { animation: typeR .38s ease-in-out infinite alternate; animation-delay: -.19s; }
      @keyframes typeL { from { transform: rotate(2deg) translateY(0); } to { transform: rotate(-2deg) translateY(2px); } }
      @keyframes typeR { from { transform: rotate(-2deg) translateY(2px); } to { transform: rotate(2deg) translateY(0); } }
      .head { animation: headFocus 2.2s ease-in-out infinite; }
      @keyframes headFocus { 0%,100% { transform: translateY(2px) rotate(0deg); } 50% { transform: translateY(4px) rotate(1.5deg); } }
      .body { animation: bodyStill 3s ease-in-out infinite; }
      @keyframes bodyStill { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.015); } }
      .tail-1 { animation: tailCalm 4s infinite; } .tail-2 { animation: tailCalm 4s infinite -.4s; } .tail-3 { animation: tailCalm 4s infinite -.8s; }
      @keyframes tailCalm { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(-3deg); } }
      
</style>
<g transform="translate(120, 128)">
  <g class="tail tail-1" style="transform-box:fill-box;transform-origin:0% 50%">
    <circle cx="26" cy="88" r="17" fill="#8DA3B8"/>
    <g class="tail-2" style="transform-box:fill-box;transform-origin:0% 50%">
      <circle cx="52" cy="97" r="15" fill="#8DA3B8"/>
      <g class="tail-3" style="transform-box:fill-box;transform-origin:0% 50%">
        <circle cx="75" cy="103" r="12.5" fill="#FDFEFF"/>
      </g>
    </g>
  </g>
  <g class="body" style="transform-box:fill-box;transform-origin:50% 100%">
    <rect x="-34" y="38" width="68" height="62" rx="26" fill="#2B3440"/>
    <path d="M-24 46 Q0 30 24 46 L24 58 Q0 44 -24 58 Z" fill="#3A4756"/>
    <path d="M-6 52 L-8 76" stroke="#59C2FF66" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 52 L8 76" stroke="#59C2FF66" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="64" width="32" height="28" rx="12" fill="#FDFEFF"/>
    <ellipse cx="-18" cy="100" rx="14" ry="8" fill="#8DA3B8"/>
    <ellipse cx="18" cy="100" rx="14" ry="8" fill="#8DA3B8"/>
  </g>
  
  <g class="head" style="transform-box:fill-box;transform-origin:50% 95%">
    <g class="ear ear-l" style="transform-box:fill-box;transform-origin:50% 100%">
    <g transform="translate(-22, -34) rotate(-14)">
      <path d="M0 26 L-4 -22 L20 8 Z" fill="#5B7A99"/>
      <path d="M2 18 L-1 -8 L13 8 Z" fill="#C7D3DE"/>
      <path d="M-2 -22 L20 8" stroke="#5B7A99" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g><g class="ear ear-r" style="transform-box:fill-box;transform-origin:50% 100%">
    <g transform="translate(22, -34) rotate(14) scale(-1,1)">
      <path d="M0 26 L-4 -22 L20 8 Z" fill="#5B7A99"/>
      <path d="M2 18 L-1 -8 L13 8 Z" fill="#C7D3DE"/>
      <path d="M-2 -22 L20 8" stroke="#5B7A99" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g>
    <circle cx="0" cy="0" r="42" fill="#8DA3B8"/>
    <path d="M0 34 Q-30 32 -36 6 Q-18 30 0 30 Q18 30 36 6 Q30 32 0 34 Z" fill="#FDFEFF"/>
    <ellipse cx="0" cy="38" rx="12" ry="8" fill="#FDFEFF"/>
    <path d="M-20 -1 Q-13 4 -6 -1" stroke="#1E2A36" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M6 -1 Q13 4 20 -1" stroke="#1E2A36" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M-4 22 L4 22 L0 27 Z" fill="#1E2A36"/>
    <path d="M-4 27 L4 27" stroke="#1E2A36" stroke-width="3.5" stroke-linecap="round"/>
    
    <path d="M-40 -8 Q0 -52 40 -8" stroke="#2B3440" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="-52" y="-12" width="14" height="22" rx="6" fill="#2B3440"/>
    <rect x="38" y="-12" width="14" height="22" rx="6" fill="#2B3440"/>
    <rect x="-49" y="-6" width="8" height="4" rx="2" fill="#59C2FF" class="glow"/>
    <rect x="41" y="-6" width="8" height="4" rx="2" fill="#59C2FF" class="glow"/>
    <circle cx="0" cy="-40" r="4.5" fill="#59C2FF" class="glow"/>
  </g>
  <g class="arm arm-l" style="transform-box:fill-box;transform-origin:100% 15%"><g transform="translate(-30, 52) rotate(24)"><rect x="-10" y="0" width="14" height="34" rx="7" fill="#2B3440"/><circle cx="-3" cy="36" r="8" fill="#8DA3B8"/></g></g>
  <g class="arm arm-r" style="transform-box:fill-box;transform-origin:0% 15%"><g transform="translate(30, 52) rotate(-24)"><rect x="-4" y="0" width="14" height="34" rx="7" fill="#2B3440"/><circle cx="3" cy="36" r="8" fill="#8DA3B8"/></g></g>
  <g class="laptop"><rect x="-40" y="102" width="80" height="7" rx="2" fill="#4A5568"/><rect x="-34" y="82" width="68" height="21" rx="2" fill="#5B6B7E"/><rect x="-31" y="85" width="62" height="15" rx="2" fill="#6FD3FF" opacity=".85"><animate attributeName="opacity" values=".85;.45;.85" dur="1.1s" repeatCount="indefinite"/></rect></g>
</g>
</svg>
