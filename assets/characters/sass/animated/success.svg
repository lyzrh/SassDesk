<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<!-- Sass animated rig (部件化肢体动画)：状态 success -->
<style>
  * { transform-box: fill-box; }
  
    .tail-1, .tail-2, .tail-3 { animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .glow { animation: glowPulse 2s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .star { animation: starTwinkle 1.4s ease-in-out infinite; }
    @keyframes starTwinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
  
      /* 弹跳庆祝 */
      .body, .head { animation: jump .55s ease-in-out infinite; }
      @keyframes jump { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-9px); } 60% { transform: translateY(-9px); } }
      /* 双臂上举挥动 */
      .arm-l { animation: waveL .55s ease-in-out infinite alternate; }
      .arm-r { animation: waveR .55s ease-in-out infinite alternate; }
      @keyframes waveL { from { transform: rotate(-12deg); } to { transform: rotate(10deg); } }
      @keyframes waveR { from { transform: rotate(12deg); } to { transform: rotate(-10deg); } }
      /* 尾巴高频大幅摇摆 */
      .tail-1 { animation: tailJoy .42s infinite; } .tail-2 { animation: tailJoy .42s infinite -.14s; } .tail-3 { animation: tailJoy .42s infinite -.28s; }
      @keyframes tailJoy { 0%,100% { transform: rotate(12deg); } 50% { transform: rotate(-12deg); } }
      
</style>
<g transform="translate(120, 128)">
  <g class="tail tail-1" style="transform-box:fill-box;transform-origin:0% 50%">
    <circle cx="28" cy="82" r="17" fill="#8DA3B8"/>
    <g class="tail-2" style="transform-box:fill-box;transform-origin:0% 50%">
      <circle cx="50" cy="58" r="15" fill="#8DA3B8"/>
      <g class="tail-3" style="transform-box:fill-box;transform-origin:0% 50%">
        <circle cx="64" cy="34" r="12.5" fill="#FDFEFF"/>
      </g>
    </g>
  </g>
  <g class="body" style="transform-box:fill-box;transform-origin:50% 100%">
    <rect x="-34" y="38" width="68" height="62" rx="26" fill="#2B3440"/>
    <path d="M-24 46 Q0 30 24 46 L24 58 Q0 44 -24 58 Z" fill="#3A4756"/>
    <path d="M-6 52 L-8 76" stroke="#59C2FF66" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 52 L8 76" stroke="#59C2FF66" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="64" width="32" height="28" rx="12" fill="#FDFEFF"/>
    <ellipse cx="-18" cy="100" rx="14" ry="8" fill="#8DA3B8"/>
    <ellipse cx="18" cy="100" rx="14" ry="8" fill="#8DA3B8"/>
  </g>
  <g class="arm arm-l" style="transform-box:fill-box;transform-origin:100% 15%"><g transform="translate(-30, 52) rotate(-140)"><rect x="-10" y="0" width="14" height="34" rx="7" fill="#2B3440"/><circle cx="-3" cy="36" r="8" fill="#8DA3B8"/></g></g>
  <g class="head" style="transform-box:fill-box;transform-origin:50% 95%">
    <g class="ear ear-l" style="transform-box:fill-box;transform-origin:50% 100%">
    <g transform="translate(-22, -34) rotate(-14)">
      <path d="M0 26 L-4 -22 L20 8 Z" fill="#5B7A99"/>
      <path d="M2 18 L-1 -8 L13 8 Z" fill="#C7D3DE"/>
      <path d="M-2 -22 L20 8" stroke="#5B7A99" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g><g class="ear ear-r" style="transform-box:fill-box;transform-origin:50% 100%">
    <g transform="translate(22, -34) rotate(14) scale(-1,1)">
      <path d="M0 26 L-4 -22 L20 8 Z" fill="#5B7A99"/>
      <path d="M2 18 L-1 -8 L13 8 Z" fill="#C7D3DE"/>
      <path d="M-2 -22 L20 8" stroke="#5B7A99" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g>
    <circle cx="0" cy="0" r="42" fill="#8DA3B8"/>
    <path d="M0 34 Q-30 32 -36 6 Q-18 30 0 30 Q18 30 36 6 Q30 32 0 34 Z" fill="#FDFEFF"/>
    <ellipse cx="0" cy="38" rx="12" ry="8" fill="#FDFEFF"/>
    <path d="M-21 2 Q-13 -8 -5 2" stroke="#1E2A36" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M5 2 Q13 -8 21 2" stroke="#1E2A36" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M-4 22 L4 22 L0 27 Z" fill="#1E2A36"/>
    <ellipse cx="0" cy="28" rx="6" ry="5" fill="#1E2A36"/><ellipse cx="0" cy="30" rx="3.5" ry="2.5" fill="#F2A9B8"/>
    
    <path d="M-40 -8 Q0 -52 40 -8" stroke="#2B3440" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="-52" y="-12" width="14" height="22" rx="6" fill="#2B3440"/>
    <rect x="38" y="-12" width="14" height="22" rx="6" fill="#2B3440"/>
    <rect x="-49" y="-6" width="8" height="4" rx="2" fill="#59C2FF" class="glow"/>
    <rect x="41" y="-6" width="8" height="4" rx="2" fill="#59C2FF" class="glow"/>
    <circle cx="0" cy="-40" r="4.5" fill="#59C2FF" class="glow"/>
  </g>
  
  <g class="arm arm-r" style="transform-box:fill-box;transform-origin:0% 15%"><g transform="translate(30, 52) rotate(140)"><rect x="-4" y="0" width="14" height="34" rx="7" fill="#2B3440"/><circle cx="3" cy="36" r="8" fill="#8DA3B8"/></g></g>
  <g class="stars"><path class="star" style="transform-box:fill-box;transform-origin:center" transform="translate(-62, -30)" d="M0 -6 L1.7999999999999998 -1.7999999999999998 L6 0 L1.7999999999999998 1.7999999999999998 L0 6 L-1.7999999999999998 1.7999999999999998 L-6 0 L-1.7999999999999998 -1.7999999999999998 Z" fill="#FFD97A"/><path class="star" style="transform-box:fill-box;transform-origin:center" transform="translate(64, -44)" d="M0 -7 L2.1 -2.1 L7 0 L2.1 2.1 L0 7 L-2.1 2.1 L-7 0 L-2.1 -2.1 Z" fill="#FFD97A"/><path class="star" style="transform-box:fill-box;transform-origin:center" transform="translate(58, 26)" d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5 Z" fill="#FFD97A"/><path class="star" style="transform-box:fill-box;transform-origin:center" transform="translate(-56, 30)" d="M0 -4 L1.2 -1.2 L4 0 L1.2 1.2 L0 4 L-1.2 1.2 L-4 0 L-1.2 -1.2 Z" fill="#FFD97A"/></g>
</g>
</svg>
