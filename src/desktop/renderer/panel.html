<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Sass 控制面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a2029; --bg-soft: #222b36; --bg-input: #141a22;
      --line: #33404f; --text: #e8eef5; --text-dim: #93a4b8;
      --accent: #59c2ff; --user: #2b4a63; --sys: #2c3440;
    }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body {
      font: 13px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--text);
      display: flex; justify-content: center; padding: 6px;
    }
    .panel {
      width: 100%; display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg); border: 1px solid #59c2ff40; border-radius: 14px;
      box-shadow: 0 12px 32px #0008;
    }
    .titlebar {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px;
      background: var(--bg-soft); -webkit-app-region: drag; flex: none;
    }
    .title { font-weight: 600; font-size: 13px; }
    .state-chip {
      font-size: 11px; color: var(--text-dim); background: #0f1620;
      border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px;
    }
    .state-chip.busy { color: var(--accent); border-color: #59c2ff66; }
    .spacer { flex: 1; }
    .icon-btn {
      width: 26px; height: 24px; border: none; border-radius: 6px; cursor: pointer;
      background: #2b3542; color: var(--text-dim); font-size: 13px; line-height: 1;
      -webkit-app-region: no-drag;
    }
    .icon-btn:hover { background: #35404f; color: var(--text); }
    .tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--bg-soft); -webkit-app-region: drag; flex: none; }
    .tab {
      padding: 6px 14px; border: none; border-radius: 8px 8px 0 0; cursor: pointer;
      background: transparent; color: var(--text-dim); font-size: 13px; -webkit-app-region: no-drag;
    }
    .tab.active { background: var(--bg); color: var(--text); font-weight: 600; }
    .view { flex: 1; display: none; flex-direction: column; min-height: 0; background: var(--bg); }
    .view.active { display: flex; }

    .chat-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .chat-log::-webkit-scrollbar { width: 8px; }
    .chat-log::-webkit-scrollbar-thumb { background: #33404f; border-radius: 4px; }
    .msg { max-width: 82%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--bg-soft); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; max-width: 92%; background: var(--sys); color: var(--text-dim); font-size: 12px; text-align: center; }
    .msg .meta { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; }
    .msg.thinking::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .empty { margin: auto; color: var(--text-dim); text-align: center; font-size: 12px; line-height: 2; }

    .composer { flex: none; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
    #chat-input {
      flex: 1; resize: none; height: 58px; background: var(--bg-input); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
      font: 13px/1.5 "Microsoft YaHei", sans-serif; outline: none;
    }
    #chat-input:focus { border-color: var(--accent); }
    #chat-send {
      align-self: stretch; padding: 0 16px; border: none; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #101820; font-size: 13px; font-weight: 600;
    }
    #chat-send:disabled { background: #33404f; color: var(--text-dim); cursor: default; }
    .tools { flex: none; display: flex; gap: 10px; padding: 0 12px 10px; }
    .link-btn {
      background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; text-decoration: underline;
    }

    .term { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
    .term h3 { font-size: 13px; font-weight: 600; }
    .term p { color: var(--text-dim); font-size: 12px; }
    .term code { background: var(--bg-input); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12px; color: var(--accent); }
    .big-btn {
      padding: 11px 16px; border: none; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #101820; font-size: 14px; font-weight: 600;
    }
    .big-btn:hover { filter: brightness(1.08); }
    .conn { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dim); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #59636f; }
    .dot.on { background: #4cc38a; }
    .tip { font-size: 12px; color: var(--text-dim); border-left: 2px solid var(--line); padding-left: 9px; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="titlebar">
      <span class="title">Sass 控制面板</span>
      <span class="state-chip" id="state-chip">待机</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-back" title="回到桌宠（最小化面板）">–</button>
      <button class="icon-btn" id="btn-close" title="关闭面板">×</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-view="chat">聊天</button>
      <button class="tab" data-view="term">终端 / CLI</button>
    </div>

    <div class="view active" id="view-chat">
      <div class="chat-log" id="chat-log">
        <div class="empty" id="chat-empty">
          和 Sass 说点什么吧<br />它会认真回答，也能帮你动手做事
        </div>
      </div>
      <div class="composer">
        <textarea id="chat-input" placeholder="Enter 发送，Shift+Enter 换行" maxlength="2000"></textarea>
        <button id="chat-send">发送</button>
      </div>
      <div class="tools">
        <button class="link-btn" id="btn-clear">清空聊天记录</button>
      </div>
    </div>

    <div class="view" id="view-term">
      <div class="term">
        <h3>CLI 控制台</h3>
        <p>CLI 是 Sass 的完整终端界面：斜杠命令、自动化规则、中文任务都在那里。桌宠状态与 CLI 实时同步。</p>
        <button class="big-btn" id="btn-cli">打开 CLI 窗口</button>
        <div class="tip">新窗口中运行 <code>npm start</code>（或已配置的 sassdesk 命令）。在 CLI 里输入 <code>/pet</code> 可查看桌宠连接状态，<code>/api off</code> 可切成不接 API 的纯命令模式。</div>
        <h3>桌宠连接</h3>
        <div class="conn"><span class="dot" id="pet-dot"></span><span id="pet-conn-text">检测中…</span></div>
        <button class="link-btn" id="btn-pet-show">显示桌宠窗口</button>
      </div>
    </div>
  </div>
  <script type="module" src="./panel.js"></script>
</body>
</html>
